name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # ручной запуск из вкладки Actions — например, после смены секретов
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# новый пуш отменяет предыдущую сборку, но уже начатый деплой не рвём
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci, а не install: ставит ровно то, что в package-lock.json
      - run: npm ci

      - run: npm run build
        env:
          # VITE_* подставляются на этапе сборки и попадают в бандл.
          # anon-ключ публичный по замыслу, доступ ограничивает RLS
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Pages отдаёт 404.html на любой неизвестный путь. Копия index.html
      # позволяет открывать /LoveMap/map напрямую и обновлять страницу
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
